    // 1. CLOUD CONFIGURATION & FIREBASE INITIALIZATION
    // =========================================================================
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'woodclock-office-v1';

      ? JSON.parse(__firebase_config)

    // 2. APPLICATION STATE (SINGLE SOURCE OF TRUTH FROM CLOUD FIRESTORE)

    // =========================================================================
    // 3. UTILITY FUNCTIONS (HASHING, DATES, WIB TIME, TOASTS)
    // =========================================================================
    async function sha256(text) {
      const msgBuffer = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function getWIBNow() {
      // Convert local browser time to Asia/Jakarta (WIB, UTC+7)
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      return new Date(utc + (3600000 * 7));
    }

    function formatDateYYYYMMDD(dateObj = getWIBNow()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatTimeHHMMSS(dateObj = getWIBNow()) {
      const h = String(dateObj.getHours()).padStart(2, '0');
      const m = String(dateObj.getMinutes()).padStart(2, '0');
      const s = String(dateObj.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function formatTimeHHMM(dateObj = getWIBNow()) {
      const h = String(dateObj.getHours()).padStart(2, '0');
      const m = String(dateObj.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    function formatIndoDate(dateStr) {
      if (!dateStr) return '-';
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString('id-ID', {
        weekday: 'long',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        error: 'bg-red-900 text-white border-red-700',
        warning: 'bg-amber-800 text-white border-amber-600',
        info: 'bg-wood-800 text-white border-wood-600'
      };
      const icons = {
        success: 'check-circle-2',
        error: 'alert-circle',
        warning: 'alert-triangle',
        info: 'info'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-xl border shadow-xl transition-all duration-300 transform translate-y-0 ${colors[type] || colors.info}`;
      el.innerHTML = `
        <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0 mt-0.5"></i>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold leading-tight">${escapeHtml(title)}</p>
          <p class="text-xs opacity-90 mt-0.5 leading-snug">${escapeHtml(message)}</p>
        </div>
        <button class="opacity-70 hover:opacity-100" onclick="this.parentElement.remove()">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      `;
      container.appendChild(el);
      if (window.lucide) lucide.createIcons();
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }, 4500);
    }

    function openModal(htmlContent, maxWidthClass = 'max-w-lg') {

    function stopCameraStream() {
      if (state.livenessTimer) {
        clearInterval(state.livenessTimer);
        state.livenessTimer = null;

      if (state.activeStream) {
        state.activeStream.getTracks().forEach(track => track.stop());

    // =========================================================================
    // 5. REAL-TIME CLOUD LISTENERS (SYNCHRONIZED ACROSS ALL DEVICES)
    // =========================================================================
    function startRealtimeListeners() {
      // Listen to work_settings
      onSnapshot(getDocRef('work_settings', 'default'), (snap) => {
        if (snap.exists()) {
          state.workSettings = { ...state.workSettings, ...snap.data() };
          renderApp();
        }
      }, (err) => console.error('work_settings listener error:', err));

      // Listen to users
      onSnapshot(getColRef('users'), (snap) => {
        state.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (state.currentUser) {
          const updated = state.users.find(u => u.id === state.currentUser.id);
          if (updated) state.currentUser = updated;
        }
        renderApp();
      }, (err) => console.error('users listener error:', err));

      // Listen to employees
      onSnapshot(getColRef('employees'), (snap) => {
        state.employees = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => a.id.localeCompare(b.id));
        renderApp();
      }, (err) => console.error('employees listener error:', err));

      // Listen to face_registrations
      onSnapshot(getColRef('face_registrations'), (snap) => {
        state.faceRegistrations = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderApp();
      }, (err) => console.error('face_registrations listener error:', err));

      // Listen to attendance
      onSnapshot(getColRef('attendance'), (snap) => {
        state.attendance = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => {
            if (b.date !== a.date) return b.date.localeCompare(a.date);
            return (b.checkIn || '').localeCompare(a.checkIn || '');
          });
        renderApp();
      }, (err) => console.error('attendance listener error:', err));

      // Listen to leave_requests
      onSnapshot(getColRef('leave_requests'), (snap) => {
        state.leaveRequests = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        renderApp();
      }, (err) => console.error('leave_requests listener error:', err));

      // Listen to notifications
      onSnapshot(getColRef('notifications'), (snap) => {
        state.notifications = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
        renderApp();

    // =========================================================================
    // 6. FACE RECOGNITION & LIVENESS ENGINE (NEURAL + BIOMETRIC VECTOR)
    // =========================================================================
    async function loadFaceModelsIfNeeded() {
      if (state.faceModelsLoaded || state.faceModelsLoading) return;
      state.faceModelsLoading = true;
      try {
        if (window.faceapi) {
          const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
          await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
            faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
            faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
          ]);
          state.faceModelsLoaded = true;
          console.log('WoodClock: Neural Face Recognition models loaded.');
        }
      } catch (e) {
        console.warn('WoodClock: Falling back to local HTML5 Biometric Landmark & Skin/Geometry Extractor.', e);
      } finally {
        state.faceModelsLoading = false;
      }
    }

    /**
     * Extracts a 128-dimension normalized facial descriptor vector from a video frame.
     * Uses neural face-api.js if available, or real multi-zone facial geometry/luminance/chrominance
     * biometric sampling with skin-tone & symmetry validation to ensure an actual human face is present.
     */
    async function extractBiometricDescriptor(videoEl, canvasEl) {
      if (!videoEl || videoEl.readyState < 2) {
        return { detected: false, reason: 'Kamera belum siap.' };
      }

      // 1. Attempt Neural Face Detection & 128-D Descriptor
      if (state.faceModelsLoaded && window.faceapi) {
        try {
          const detection = await faceapi
            .detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.45 }))
            .withFaceLandmarks()
            .withFaceDescriptor();

          if (!detection) {
            return { detected: false, reason: 'Wajah tidak terdeteksi di area kamera.' };
          }
          return {
            detected: true,
            method: 'neural-128d',
            descriptor: Array.from(detection.descriptor),
            box: detection.detection.box,
            landmarks: detection.landmarks.positions
          };
        } catch (err) {
          console.warn('Neural detection error, using geometric biometric extractor:', err);
        }
      }

      // 2. Real Computer-Vision Biometric Fallback (Skin-chrominance + Facial Symmetry + 128-D Spatial Grid)
      const ctx = canvasEl.getContext('2d', { willReadFrequently: true });
      const w = 160;
      const h = 120;
      canvasEl.width = w;
      canvasEl.height = h;
      ctx.drawImage(videoEl, 0, 0, w, h);

      const frame = ctx.getImageData(0, 0, w, h).data;

      // Focus on central face oval region (x: 40..120, y: 15..105)
      let skinPixels = 0;
      let totalCenterPixels = 0;
      let leftBrightness = 0;
      let rightBrightness = 0;
      let edgeVariance = 0;

      for (let y = 15; y < 105; y++) {
        for (let x = 40; x < 120; x++) {
          const idx = (y * w + x) * 4;
          const r = frame[idx], g = frame[idx + 1], b = frame[idx + 2];
          totalCenterPixels++;

          // YCbCr human skin-tone chrominance check
          const cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
          const cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
          const isSkin = (cr >= 132 && cr <= 178 && cb >= 76 && cb <= 128 && r > 45 && g > 30);
          if (isSkin) skinPixels++;

          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          if (x < 80) leftBrightness += lum;
          else rightBrightness += lum;

          if (x > 40) {
            const prevIdx = (y * w + (x - 1)) * 4;
            const prevLum = 0.299 * frame[prevIdx] + 0.587 * frame[prevIdx + 1] + 0.114 * frame[prevIdx + 2];
            edgeVariance += Math.abs(lum - prevLum);
          }
        }
      }

      const skinRatio = skinPixels / totalCenterPixels;
      const avgEdge = edgeVariance / totalCenterPixels;
      const symmetryDiff = Math.abs(leftBrightness - rightBrightness) / (totalCenterPixels / 2);

      // Validate that a real face-like structure is centered in frame (not empty wall, ceiling, or covered lens)
      if (skinRatio < 0.18 || avgEdge < 3.2 || symmetryDiff > 65) {
        return {
          detected: false,
          reason: skinRatio < 0.18
            ? 'Wajah tidak terdeteksi jelas di dalam bingkai oval.'
            : 'Pencahayaan atau posisi wajah kurang sesuai.'
        };
      }

      // Build normalized 128-dimensional spatial biometric descriptor from 8x8 facial grid (luminance + Cr/Cb ratios)
      const descriptor = [];
      const gridX = 8, gridY = 8;
      const cellW = Math.floor(80 / gridX);
      const cellH = Math.floor(90 / gridY);

      for (let gy = 0; gy < gridY; gy++) {
        for (let gx = 0; gx < gridX; gx++) {
          let sumLum = 0, sumCr = 0, count = 0;
          for (let py = 15 + gy * cellH; py < 15 + (gy + 1) * cellH; py++) {
            for (let px = 40 + gx * cellW; px < 40 + (gx + 1) * cellW; px++) {
              const i = (py * w + px) * 4;
              const r = frame[i], g = frame[i + 1], b = frame[i + 2];
              const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
              const cr = (128 + 0.5 * r - 0.418688 * g - 0.081312 * b) / 255;
              sumLum += lum;
              sumCr += cr;
              count++;
            }
          }
          descriptor.push(Number((sumLum / count).toFixed(5)));
          descriptor.push(Number((sumCr / count).toFixed(5)));
        }
      }

      // L2-normalize the 128-D vector
      const norm = Math.sqrt(descriptor.reduce((acc, v) => acc + v * v, 0)) || 1;
      const normalized = descriptor.map(v => v / norm);

      return {
        detected: true,
        method: 'biometric-grid-128d',
        descriptor: normalized,
        rawFramePixels: frame
      };
    }

    function computeDescriptorDistance(descA, descB) {
      if (!descA || !descB || descA.length !== descB.length) return 999;
      let sumSq = 0;
      for (let i = 0; i < descA.length; i++) {
        const diff = descA[i] - descB[i];
        sumSq += diff * diff;
      }
      return Math.sqrt(sumSq);
    }

    function computeFrameMotion(pixelsA, pixelsB) {
      if (!pixelsA || !pixelsB || pixelsA.length !== pixelsB.length) return 0;
      let diffSum = 0;
      let samples = 0;
      for (let i = 0; i < pixelsA.length; i += 16) {
        diffSum += Math.abs(pixelsA[i] - pixelsB[i]);
        samples++;
      }
      return diffSum / (samples || 1);
    }

    window.captureAndSaveFace = async function(employeeId) {
      if (!state.isOnline) {
        showToast('Offline', 'Tidak dapat menyimpan data wajah saat koneksi terputus.', 'error');
        return;
      }
      const video = document.getElementById('reg-video');
      const canvas = document.getElementById('reg-canvas');
      const st = document.getElementById('face-reg-status');
      const btn = document.getElementById('btn-capture-face');

      if (!video || !canvas) return;
      btn.disabled = true;

      st.className = 'flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-amber-50 text-amber-800 border border-amber-200 text-xs sm:text-sm font-medium';
      st.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Memindai Wajah & Mengekstrak Pola Biometrik...</span>`;
      if (window.lucide) lucide.createIcons();

      // Capture 2 samples 350ms apart to verify stability & real face
      const sample1 = await extractBiometricDescriptor(video, canvas);
      await new Promise(r => setTimeout(r, 350));
      const sample2 = await extractBiometricDescriptor(video, canvas);

      if (!sample1.detected || !sample2.detected) {
        st.className = 'flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-red-50 text-red-800 border border-red-200 text-xs sm:text-sm font-medium';
        st.innerHTML = `<i data-lucide="x-circle" class="w-4 h-4 text-red-600"></i><span>Wajah Tidak Terdeteksi — ${escapeHtml(sample1.reason || 'Pastikan wajah terlihat jelas.')}</span>`;
        if (window.lucide) lucide.createIcons();
        btn.disabled = false;
        return;
      }

      // Average the two descriptors for higher accuracy
      const avgDescriptor = sample1.descriptor.map((v, i) => (v + sample2.descriptor[i]) / 2);

      // Ensure this face isn't already registered to a DIFFERENT employee (anti-duplicate identity)
      for (const existing of state.faceRegistrations) {
        if (existing.employeeId !== employeeId && existing.method === sample1.method) {
          const dist = computeDescriptorDistance(avgDescriptor, existing.descriptor);
          const threshold = sample1.method === 'neural-128d' ? 0.42 : 0.045;
          if (dist < threshold) {
            st.className = 'flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-red-50 text-red-800 border border-red-200 text-xs sm:text-sm font-medium';
            st.innerHTML = `<i data-lucide="shield-alert" class="w-4 h-4 text-red-600"></i><span>Verifikasi Gagal: Wajah ini sudah terdaftar pada akun pegawai lain!</span>`;
            if (window.lucide) lucide.createIcons();
            btn.disabled = false;
            return;
          }
        }
      }

      try {
        const emp = state.employees.find(e => e.id === employeeId);
        await setDoc(getDocRef('face_registrations', employeeId), {
          id: employeeId,
          employeeId: employeeId,
          employeeName: emp ? emp.name : employeeId,
          method: sample1.method,
          descriptor: avgDescriptor,
          registeredAt: new Date().toISOString(),
          status: 'Terverifikasi'
        });

        await updateDoc(getDocRef('employees', employeeId), {
          faceRegistered: true,
          faceUpdateRequested: false
        });

        closeModal();
        showToast('Registrasi Wajah Berhasil', 'Data biometrik wajah telah tersimpan aman di database cloud.', 'success');
      } catch (err) {
        console.error(err);
        showToast('Gagal Menyimpan', 'Terjadi kesalahan saat menyimpan data wajah ke cloud.', 'error');
        btn.disabled = false;
      }
    };

    window.runFaceVerificationPipeline = async function(actionType) {
      const video = document.getElementById('verify-video');
      const canvas = document.getElementById('verify-canvas');
      const retryBtn = document.getElementById('btn-retry-verify');
      const oval = document.getElementById('verify-oval');
      const s1 = document.getElementById('step-1');
      const s2 = document.getElementById('step-2');
      const s3 = document.getElementById('step-3');

      if (!video || !canvas) return;
      if (retryBtn) retryBtn.disabled = true;

      // Reset step pills
      [s1, s2, s3].forEach(el => {
        if (el) el.className = 'p-2 rounded-lg bg-wood-100 text-wood-600 border border-wood-200';
      });

      // STEP 1: Memindai Wajah
      updateVerifyBanner('Memindai Wajah...', 'scanning');
      await new Promise(r => setTimeout(r, 550));
      const frame1 = await extractBiometricDescriptor(video, canvas);

      if (!frame1.detected) {
        updateVerifyBanner('Wajah Tidak Terdeteksi — Posisikan wajah Anda di dalam bingkai.', 'error');
        if (oval) oval.classList.replace('border-amber-300', 'border-red-500');
        if (retryBtn) retryBtn.disabled = false;
        return;
      }
      if (s1) s1.className = 'p-2 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300 font-semibold';

      // STEP 2: Liveness Detection (Check natural micro-movement / blink across frames)
      updateVerifyBanner('Memindai Wajah — Pemeriksaan Keaslian (Liveness)...', 'scanning');
      await new Promise(r => setTimeout(r, 650));
      const frame2 = await extractBiometricDescriptor(video, canvas);

      if (!frame2.detected) {
        updateVerifyBanner('Wajah Tidak Terdeteksi — Jangan menjauh dari kamera.', 'error');
        if (retryBtn) retryBtn.disabled = false;
        return;
      }

      // Check liveness movement between frame1 & frame2
      let isLive = true;
      if (frame1.rawFramePixels && frame2.rawFramePixels) {
        const motion = computeFrameMotion(frame1.rawFramePixels, frame2.rawFramePixels);
        // If frame is completely frozen (0.000 diff, e.g., virtual static image injection), reject
        if (motion < 0.15) {
          isLive = false;
        }
      } else if (frame1.landmarks && frame2.landmarks) {
        let shift = 0;
        for (let i = 0; i < Math.min(10, frame1.landmarks.length); i++) {
          shift += Math.hypot(frame1.landmarks[i].x - frame2.landmarks[i].x, frame1.landmarks[i].y - frame2.landmarks[i].y);
        }
        if (shift < 0.05) isLive = false;
      }

      if (!isLive) {
        updateVerifyBanner('Verifikasi Gagal — Liveness tidak terdeteksi (gerakkan kepala sedikit).', 'error');
        if (retryBtn) retryBtn.disabled = false;
        return;
      }
      if (s2) s2.className = 'p-2 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300 font-semibold';

      // STEP 3: Memverifikasi Identitas (Biometric Vector Comparison)
      updateVerifyBanner('Memverifikasi Identitas...', 'scanning');
      await new Promise(r => setTimeout(r, 500));

      const empId = state.currentUser.employeeId;
      const registered = state.faceRegistrations.find(f => f.employeeId === empId);

      if (!registered) {
        updateVerifyBanner('Verifikasi Gagal — Data referensi wajah tidak ditemukan.', 'error');
        return;
      }

      // If model methods differ (e.g. registered with fallback, verified with neural), re-extract matching method
      const distance = computeDescriptorDistance(frame2.descriptor, registered.descriptor);
      const threshold = registered.method === 'neural-128d' ? 0.56 : 0.14;

      if (distance > threshold) {
        updateVerifyBanner('Wajah Tidak Dikenali — Wajah tidak sesuai dengan akun yang login.', 'error');
        if (oval) oval.className = 'w-44 h-56 sm:w-52 sm:h-64 rounded-full border-2 border-red-500 shadow-[0_0_0_9999px_rgba(28,16,8,0.45)]';
        if (retryBtn) retryBtn.disabled = false;
        return;
      }

      // MATCH CONFIRMED!
      if (s3) s3.className = 'p-2 rounded-lg bg-emerald-100 text-emerald-800 border border-emerald-300 font-semibold';
      if (oval) oval.className = 'w-44 h-56 sm:w-52 sm:h-64 rounded-full border-4 border-emerald-400 shadow-[0_0_0_9999px_rgba(28,16,8,0.45)]';
      updateVerifyBanner('Verifikasi Berhasil — Menyimpan presensi ke cloud...', 'success');

      await new Promise(r => setTimeout(r, 550));
      await commitAttendanceToCloud(actionType);
    };

    // =========================================================================
    // 8. CLOUD ATTENDANCE COMMIT (CHECK IN & CHECK OUT)
    // =========================================================================
    async function commitAttendanceToCloud(actionType) {
      const empId = state.currentUser.employeeId;
      const emp = state.employees.find(e => e.id === empId);
      const nowWIB = getWIBNow();
      const todayStr = formatDateYYYYMMDD(nowWIB);
      const timeNowStr = formatTimeHHMMSS(nowWIB);
      const docId = `ATT-${empId}-${todayStr}`;

      try {
        // Server/Cloud Double-Check to prevent duplicate records across multiple devices
        const existingSnap = await getDoc(getDocRef('attendance', docId));

        if (actionType === 'checkin') {
          if (existingSnap.exists() && existingSnap.data().checkIn && existingSnap.data().checkIn !== '-') {
            closeModal();
            showToast('Presensi Ganda Dicegah', 'Anda sudah tercatat Check In hari ini di database cloud.', 'warning');
            return;
          }

          // Calculate On-Time vs Terlambat against workSettings
          const [deadH, deadM] = (state.workSettings.checkInDeadline || '08:00').split(':').map(Number);
          const tolerance = Number(state.workSettings.toleranceMinutes || 0);
          const deadlineMinutes = deadH * 60 + deadM + tolerance;
          const actualMinutes = nowWIB.getHours() * 60 + nowWIB.getMinutes();

          const isLate = actualMinutes > deadlineMinutes;
          const lateMinutes = isLate ? (actualMinutes - (deadH * 60 + deadM)) : 0;
          const status = isLate ? 'Terlambat' : 'Hadir';
          const note = isLate ? `Terlambat ${lateMinutes} menit` : 'Tepat waktu';

          await setDoc(getDocRef('attendance', docId), {
            id: docId,
            employeeId: empId,
            employeeName: emp ? emp.name : state.currentUser.name,
            date: todayStr,
            checkIn: timeNowStr,
            checkOut: '-',
            status: status,
            lateMinutes: lateMinutes,
            note: note,
            verifiedByFace: true,
            isDemo: false,
            updatedAt: new Date().toISOString()
          });

          // Create Real-time Notification for Admin
          await addDoc(getColRef('notifications'), {
            targetRole: 'admin',
            targetEmployeeId: '',
            title: `Check In: ${emp ? emp.name : state.currentUser.name}`,
            message: `${status} pada pukul ${timeNowStr} WIB (${note})`,
            read: false,
            createdAt: new Date().toISOString()
          });

          closeModal();
          showToast(
            'Check In Berhasil!',
            `Tercatat pukul ${timeNowStr} WIB — Status: ${status}. Tersinkronisasi ke Cloud.`,
            isLate ? 'warning' : 'success'
          );

        } else if (actionType === 'checkout') {
          if (!existingSnap.exists() || !existingSnap.data().checkIn || existingSnap.data().checkIn === '-') {
            closeModal();
            showToast('Gagal Check Out', 'Data Check In hari ini tidak ditemukan di cloud.', 'error');
            return;
          }
          if (existingSnap.data().checkOut && existingSnap.data().checkOut !== '-') {
            closeModal();
            showToast('Sudah Check Out', 'Anda sudah melakukan Check Out hari ini.', 'warning');
            return;
          }

          await updateDoc(getDocRef('attendance', docId), {
            checkOut: timeNowStr,
            updatedAt: new Date().toISOString()
          });

          await addDoc(getColRef('notifications'), {
            targetRole: 'admin',
            targetEmployeeId: '',
            title: `Check Out: ${emp ? emp.name : state.currentUser.name}`,
            message: `Presensi pulang tercatat pukul ${timeNowStr} WIB`,
            read: false,
            createdAt: new Date().toISOString()
          });

          closeModal();
          showToast('Check Out Berhasil!', `Jam pulang ${timeNowStr} WIB telah disimpan ke database cloud.`, 'success');
        }
      } catch (err) {
        console.error('Attendance cloud commit error:', err);
        closeModal();
        showToast('Gagal Menyimpan ke Cloud', 'Periksa koneksi internet Anda dan coba kembali.', 'error');
      }
    }

    window.handleLoginSubmit = async function(e) {
      e.preventDefault();
      if (!state.isOnline) {
        showToast('Offline', 'Tidak dapat login saat offline. Periksa koneksi internet Anda.', 'error');
        return;
      }

      const identifier = document.getElementById('login-identifier').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;
      const errBox = document.getElementById('login-error-box');
      const submitBtn = document.getElementById('btn-login-submit');

      if (!identifier || !password) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Memverifikasi Akun Cloud...</span>`;
      if (window.lucide) lucide.createIcons();

      try {
        // Ensure latest users from Firestore
        const snap = await getDocs(getColRef('users'));
        const allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const passHash = await sha256(password);

        const matchedUser = allUsers.find(u =>
          (u.username.toLowerCase() === identifier || u.email.toLowerCase() === identifier) &&
          u.passwordHash === passHash
        );

        if (!matchedUser) {
          if (errBox) {
            errBox.textContent = 'Username/Email atau Password tidak sesuai. Silakan periksa kembali.';
            errBox.classList.remove('hidden');
          }
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Masuk ke WoodClock</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          if (window.lucide) lucide.createIcons();
          return;
        }

        // Check if employee account is active
        if (matchedUser.role === 'employee') {
          const emp = state.employees.find(em => em.id === matchedUser.employeeId);
          if (emp && emp.status === 'Nonaktif') {
            if (errBox) {
              errBox.textContent = 'Akun pegawai Anda berstatus Nonaktif. Hubungi Admin/HRD.';
              errBox.classList.remove('hidden');
            }
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Masuk ke WoodClock</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;
            if (window.lucide) lucide.createIcons();
            return;
          }
        }

        state.currentUser = matchedUser;
        state.activeTab = 'dashboard';
        showToast('Login Berhasil', `Selamat datang kembali, ${matchedUser.name}!`, 'success');
        renderApp();
      } catch (err) {
        console.error(err);
        showToast('Kesalahan Server', 'Gagal menghubungkan ke database cloud.', 'error');
        submitBtn.disabled = false;
      }
    };

    window.submitLeaveRequest = async function(e) {
      e.preventDefault();
      if (!state.isOnline) {
        showToast('Offline', 'Tidak dapat mengirim pengajuan saat offline.', 'error');
        return;
      }

      const type = document.getElementById('leave-type').value;
      const startDate = document.getElementById('leave-start').value;
      const endDate = document.getElementById('leave-end').value;
      const reason = document.getElementById('leave-reason').value.trim();
      const fileInput = document.getElementById('leave-file');

      if (!startDate || !endDate || !reason) {
        showToast('Data Belum Lengkap', 'Harap lengkapi tanggal dan keterangan pengajuan.', 'warning');
        return;
      }
      if (endDate < startDate) {
        showToast('Tanggal Tidak Valid', 'Tanggal selesai tidak boleh lebih awal dari tanggal mulai.', 'error');
        return;
      }

      let attachmentName = '';
      let attachmentData = '';
      if (fileInput && fileInput.files && fileInput.files[0]) {
        const file = fileInput.files[0];
        if (file.size > 700 * 1024) {
          showToast('Ukuran File Terlalu Besar', 'Maksimal ukuran lampiran dokumen adalah 700 KB.', 'error');
          return;
        }
        attachmentName = file.name;
        attachmentData = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
      }

      const empId = state.currentUser.employeeId;
      const emp = state.employees.find(em => em.id === empId);

      try {
        await addDoc(getColRef('leave_requests'), {
          employeeId: empId,
          employeeName: emp ? emp.name : state.currentUser.name,
          type,
          startDate,
          endDate,
          reason,
          attachmentName,
          attachmentData,
          status: 'Menunggu',
          reviewedBy: '',
          createdAt: new Date().toISOString(),
          isDemo: false
        });

        await addDoc(getColRef('notifications'), {
          targetRole: 'admin',
          targetEmployeeId: '',
          title: `Pengajuan ${type} Baru`,
          message: `${emp ? emp.name : state.currentUser.name} mengajukan ${type} (${startDate} s/d ${endDate})`,
          read: false,
          createdAt: new Date().toISOString()
        });

        showToast('Pengajuan Terkirim', `Pengajuan ${type} berhasil disimpan ke cloud dan menunggu persetujuan Admin.`, 'success');
        e.target.reset();
      } catch (err) {
        console.error(err);
        showToast('Gagal Mengirim', 'Terjadi kesalahan saat menyimpan pengajuan ke cloud.', 'error');
      }
    };

    window.saveEmployeeToCloud = async function(e, existingEmpId) {
      e.preventDefault();
      if (!state.isOnline) {
        showToast('Offline', 'Tidak dapat menyimpan data saat offline.', 'error');
        return;
      }

      const id = document.getElementById('emp-f-id').value.trim().toUpperCase();
      const name = document.getElementById('emp-f-name').value.trim();
      const gender = document.getElementById('emp-f-gender').value;
      const position = document.getElementById('emp-f-position').value.trim();
      const email = document.getElementById('emp-f-email').value.trim().toLowerCase();
      const phone = document.getElementById('emp-f-phone').value.trim();
      const username = document.getElementById('emp-f-username').value.trim().toLowerCase();
      const rawPassword = document.getElementById('emp-f-password').value;
      const status = document.getElementById('emp-f-status').value;

      // Validate duplicate ID/username on creation
      if (!existingEmpId) {
        if (state.employees.some(emp => emp.id === id)) {
          showToast('ID Duplikat', `ID Pegawai ${id} sudah digunakan.`, 'error');
          return;
        }
        if (state.users.some(u => u.username.toLowerCase() === username || u.email.toLowerCase() === email)) {
          showToast('Akun Sudah Terdaftar', 'Username atau Email sudah digunakan pengguna lain.', 'error');
          return;
        }
      }

      try {
        const userDocId = existingEmpId
          ? (state.users.find(u => u.employeeId === existingEmpId)?.id || `USR-${id}`)
          : `USR-${id}`;

        const empData = {
          id,
          userId: userDocId,
          name,
          gender,
          position,
          email,
          phone,
          username,
          status,
          avatarColor: '#8B5A2B',
          updatedAt: new Date().toISOString()
        };

        if (!existingEmpId) {
          empData.faceRegistered = false;
          empData.faceUpdateRequested = false;
          empData.isDemo = false;
          empData.createdAt = new Date().toISOString();
          await setDoc(getDocRef('employees', id), empData);
        } else {
          await updateDoc(getDocRef('employees', id), empData);
        }

        const userUpdate = {
          id: userDocId,
          employeeId: id,
          username,
          email,
          role: 'employee',
          name
        };
        if (rawPassword) {
          userUpdate.passwordHash = await sha256(rawPassword);
        } else if (!existingEmpId) {
          userUpdate.passwordHash = await sha256('pegawai123');
        }

        if (!existingEmpId) {
          userUpdate.isDemo = false;
          userUpdate.createdAt = new Date().toISOString();
          await setDoc(getDocRef('users', userDocId), userUpdate);
        } else {
          await updateDoc(getDocRef('users', userDocId), userUpdate);
        }

        closeModal();
        showToast('Berhasil Disimpan', `Data pegawai ${name} telah diperbarui di cloud.`, 'success');
      } catch (err) {
        console.error(err);
        showToast('Gagal Menyimpan', 'Terjadi kesalahan saat menyimpan ke database cloud.', 'error');
      }
    };

      // decision: 'Disetujui' | 'Ditolak'
      const req = state.leaveRequests.find(r => r.id === leaveId);
      if (!req) return;

      try {
        await updateDoc(getDocRef('leave_requests', leaveId), {
          status: decision,
          reviewedBy: state.currentUser.name,
          reviewedAt: new Date().toISOString()
        });

        // If Approved, automatically record each date in the attendance collection!
        if (decision === 'Disetujui') {
          const [sy, sm, sd] = req.startDate.split('-').map(Number);
          const [ey, em, ed] = req.endDate.split('-').map(Number);
          let cur = new Date(sy, sm - 1, sd);
          const end = new Date(ey, em - 1, ed);

          while (cur <= end) {
            const dateStr = formatDateYYYYMMDD(cur);
            const attId = `ATT-${req.employeeId}-${dateStr}`;
            await setDoc(getDocRef('attendance', attId), {
              id: attId,
              employeeId: req.employeeId,
              employeeName: req.employeeName,
              date: dateStr,
              checkIn: '-',
              checkOut: '-',
              status: req.type, // 'Izin' or 'Sakit'
              lateMinutes: 0,
              note: `${req.type}: ${req.reason}`,
              verifiedByFace: false,
              isDemo: req.isDemo || false
            });
            cur.setDate(cur.getDate() + 1);
          }
        }

        // Send instant cloud notification to the employee
        await addDoc(getColRef('notifications'), {
          targetRole: 'employee',
          targetEmployeeId: req.employeeId,
          title: `Pengajuan ${req.type} ${decision}`,
          message: `Pengajuan ${req.type} Anda (${req.startDate}) telah ${decision.toLowerCase()} oleh ${state.currentUser.name}.`,
          read: false,
          createdAt: new Date().toISOString()
        });

        showToast(`Pengajuan ${decision}`, `Status pengajuan ${req.employeeName} diperbarui secara real-time.`, decision === 'Disetujui' ? 'success' : 'warning');
      } catch (err) {
        console.error(err);
        showToast('Gagal Memproses', 'Terjadi kesalahan saat memperbarui status pengajuan.', 'error');
      }
    };

    // =========================================================================
    function getFilteredAttendance() {
      return state.attendance.filter(a => {
        if (state.currentUser?.role === 'employee' && a.employeeId !== state.currentUser.employeeId) {
          return false;
        }
        if (state.searchQuery) {
          const q = state.searchQuery.toLowerCase();
          const matchName = (a.employeeName || '').toLowerCase().includes(q);
          const matchId = (a.employeeId || '').toLowerCase().includes(q);
          if (!matchName && !matchId) return false;
        }
        if (state.filterDate && a.date !== state.filterDate) return false;
        if (!state.filterDate) {
          if (state.filterYear && !a.date.startsWith(state.filterYear)) return false;
          if (state.filterMonth && state.filterMonth !== 'ALL' && a.date.slice(5, 7) !== state.filterMonth) return false;
        }
        if (state.filterStatus && state.filterStatus !== 'ALL' && a.status !== state.filterStatus) return false;
        return true;
      });
    }

    window.exportReportExcel = function() {
      if (!window.XLSX) {
        showToast('Library Belum Siap', 'Modul Excel sedang dimuat, coba sesaat lagi.', 'warning');
        return;
      }
      const rows = getFilteredAttendance().map((a, idx) => ({
        'No': idx + 1,
        'ID Pegawai': a.employeeId,
        'Nama Pegawai': a.employeeName,
        'Tanggal': a.date,
        'Jam Masuk (WIB)': a.checkIn || '-',

        'Status': a.status,
        'Keterangan': a.note || '-',
        'Verifikasi Wajah': a.verifiedByFace ? 'Terverifikasi' : '-'
      }));

      const ws = XLSX.utils.json_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Laporan Presensi');
      XLSX.writeFile(wb, `Laporan_Presensi_WoodClock_${formatDateYYYYMMDD()}.xlsx`);
      showToast('Unduhan Excel Berhasil', 'File laporan .xlsx telah diunduh.', 'success');
    };

    window.exportReportPDF = function() {
      if (!window.jspdf) {
        showToast('Library Belum Siap', 'Modul PDF sedang dimuat, coba sesaat lagi.', 'warning');
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');

      doc.setFillColor(92, 58, 33);
      doc.rect(0, 0, 210, 26, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.text('WOODCLOCK — LAPORAN PRESENSI PEGAWAI', 14, 12);
      doc.setFontSize(9);
      doc.text(`${state.workSettings.companyName} | Dicetak: ${formatDateYYYYMMDD()} ${formatTimeHHMM()} WIB`, 14, 19);

      const tableData = getFilteredAttendance().map((a, i) => [
        i + 1,
        a.employeeId,
        a.employeeName,
        a.date,
        a.checkIn || '-',
        a.checkOut || '-',
        a.status,
        a.note || '-'
      ]);

      doc.autoTable({
        startY: 32,
        head: [['No', 'ID', 'Nama Pegawai', 'Tanggal', 'Masuk', 'Pulang', 'Status', 'Keterangan']],
        body: tableData,
        styles: { fontSize: 8, cellPadding: 2.5 },
        headStyles: { fillColor: [92, 58, 33], textColor: 255 }
      });

      doc.save(`Laporan_Presensi_WoodClock_${formatDateYYYYMMDD()}.pdf`);
      showToast('Unduhan PDF Berhasil', 'File laporan .pdf telah diunduh.', 'success');
    };

              ${state.leaveRequests.length === 0 ? `
                <div class="p-8 text-center text-xs text-wood-500">Belum ada pengajuan izin atau sakit.</div>
              ` : state.leaveRequests.map(req => `
                <div class="p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4 hover:bg-wood-50/50">
                  <div class="space-y-1.5">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="font-bold text-sm text-wood-900">${escapeHtml(req.employeeName)} (${escapeHtml(req.employeeId)})</span>
                      ${renderStatusBadge(req.type)}
                      ${renderStatusBadge(req.status)}
                      ${renderDemoBadge(req.isDemo)}
                    </div>
                    <p class="text-xs font-medium text-wood-600">Periode: <strong>${escapeHtml(req.startDate)}</strong> s/d <strong>${escapeHtml(req.endDate)}</strong></p>
                    <p class="text-xs sm:text-sm text-wood-800">${escapeHtml(req.reason)}</p>
                    ${req.attachmentName ? `
                      <div class="pt-1">
                        ${req.attachmentData ? `
                          <a href="${req.attachmentData}" download="${escapeHtml(req.attachmentName)}" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-wood-100 text-wood-800 text-xs font-semibold hover:bg-wood-200">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> Unduh Lampiran: ${escapeHtml(req.attachmentName)}
                          </a>
                        ` : `
                          <span class="inline-flex items-center gap-1.5 text-xs text-wood-600"><i data-lucide="paperclip" class="w-3.5 h-3.5"></i>${escapeHtml(req.attachmentName)}</span>
                        `}
                      </div>
                    ` : ''}
                  </div>

                  <div class="flex items-center gap-2 shrink-0">
                    ${req.status === 'Menunggu' ? `
                      <button onclick="handleLeaveDecision('${req.id}', 'Disetujui')" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-semibold inline-flex items-center gap-1.5 shadow-xs">
                        <i data-lucide="check" class="w-4 h-4"></i> Setujui
                      </button>
                      <button onclick="handleLeaveDecision('${req.id}', 'Ditolak')" class="px-4 py-2 rounded-xl bg-red-700 hover:bg-red-800 text-white text-xs font-semibold inline-flex items-center gap-1.5 shadow-xs">
                        <i data-lucide="x" class="w-4 h-4"></i> Tolak
                      </button>
                    ` : `
                      <span class="text-xs text-wood-500 italic">Diproses oleh ${escapeHtml(req.reviewedBy || 'Admin')}</span>
                    `}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // TAB 6: ATTENDANCE REPORTS & EXPORT (EXCEL + PDF)
      if (state.activeTab === 'reports') {
        const recapByEmployee = state.employees.map(emp => {
          const recs = state.attendance.filter(a => a.employeeId === emp.id);
          return {
            ...emp,
            hadir: recs.filter(r => r.status === 'Hadir').length,
            terlambat: recs.filter(r => r.status === 'Terlambat').length,
            izin: recs.filter(r => r.status === 'Izin').length,
            sakit: recs.filter(r => r.status === 'Sakit').length,
            total: recs.length
          };
        });

        return `
          <div class="space-y-6">
            <div class="bg-white p-5 rounded-2xl border border-wood-200 shadow-2xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h3 class="font-display font-bold text-wood-900 text-base">Laporan & Rekapitulasi Presensi</h3>
                <p class="text-xs text-wood-500">Unduh laporan administrasi dalam format Excel (.xlsx) atau PDF</p>
              </div>
              <div class="flex flex-wrap items-center gap-2.5">
                <button onclick="exportReportExcel()" class="px-4 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs sm:text-sm font-semibold inline-flex items-center gap-2 shadow-xs">
                  <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                  <span>Unduh Excel (.xlsx)</span>
                </button>
                <button onclick="exportReportPDF()" class="px-4 py-2.5 rounded-xl bg-red-700 hover:bg-red-800 text-white text-xs sm:text-sm font-semibold inline-flex items-center gap-2 shadow-xs">
                  <i data-lucide="file-down" class="w-4 h-4"></i>
                  <span>Unduh PDF</span>
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-wood-200 overflow-hidden shadow-2xs">
              <div class="px-5 py-4 border-b border-wood-200">
                <h4 class="font-display font-bold text-wood-900 text-sm">Rekapitulasi Kehadiran Per Pegawai</h4>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm">
                  <thead class="bg-wood-50 text-wood-600 font-semibold border-b border-wood-200">
                    <tr>
                      <th class="px-4 py-3">ID</th>
                      <th class="px-4 py-3">Nama Pegawai</th>
                      <th class="px-4 py-3">Jabatan</th>
                      <th class="px-4 py-3 text-center">Hadir</th>
                      <th class="px-4 py-3 text-center">Terlambat</th>
                      <th class="px-4 py-3 text-center">Izin</th>
                      <th class="px-4 py-3 text-center">Sakit</th>
                      <th class="px-4 py-3 text-center">Total Tercatat</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-wood-100">
                    ${recapByEmployee.map(r => `
                      <tr class="hover:bg-wood-50/70">
                        <td class="px-4 py-3 font-mono text-xs">${escapeHtml(r.id)}</td>
                        <td class="px-4 py-3 font-bold text-wood-900">${escapeHtml(r.name)}</td>
                        <td class="px-4 py-3 text-wood-600">${escapeHtml(r.position)}</td>
                        <td class="px-4 py-3 text-center font-bold text-emerald-700">${r.hadir}</td>
                        <td class="px-4 py-3 text-center font-bold text-amber-700">${r.terlambat}</td>
                        <td class="px-4 py-3 text-center font-bold text-blue-700">${r.izin}</td>
                        <td class="px-4 py-3 text-center font-bold text-purple-700">${r.sakit}</td>
                        <td class="px-4 py-3 text-center font-extrabold text-wood-900">${r.total}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      // TAB 7: WORK SETTINGS
      if (state.activeTab === 'settings') {
        return `
          <div class="max-w-2xl mx-auto bg-white rounded-2xl border border-wood-200 p-6 shadow-2xs">
            <h3 class="font-display font-bold text-wood-900 text-lg border-b border-wood-200 pb-3">Pengaturan Jam Kerja & Perusahaan</h3>
            <p class="text-xs text-wood-500 mt-2">Perubahan aturan jam kerja akan langsung disinkronisasikan ke seluruh perangkat pegawai.</p>

            <form onsubmit="saveWorkSettingsToCloud(event)" class="mt-5 space-y-4 text-sm">
              <div>
                <label class="block text-xs font-semibold text-wood-700 mb-1">Nama Perusahaan / Instansi</label>
                <input id="set-company" type="text" required value="${escapeHtml(state.workSettings.companyName)}" class="w-full px-3.5 py-2.5 rounded-xl border border-wood-300 outline-hidden focus:ring-2 focus:ring-wood-500" />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-wood-700 mb-1">Batas Check In (WIB)</label>
                  <input id="set-checkin" type="time" required value="${escapeHtml(state.workSettings.checkInDeadline)}" class="w-full px-3.5 py-2.5 rounded-xl border border-wood-300 outline-hidden" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-wood-700 mb-1">Mulai Check Out (WIB)</label>
                  <input id="set-checkout" type="time" required value="${escapeHtml(state.workSettings.checkOutStart)}" class="w-full px-3.5 py-2.5 rounded-xl border border-wood-300 outline-hidden" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-wood-700 mb-1">Toleransi Terlambat (Menit)</label>
                  <input id="set-tolerance" type="number" min="0" max="120" value="${Number(state.workSettings.toleranceMinutes || 0)}" class="w-full px-3.5 py-2.5 rounded-xl border border-wood-300 outline-hidden" />
                </div>
              </div>

              <div class="pt-3 border-t border-wood-200 flex justify-end">
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-wood-700 hover:bg-wood-800 text-white font-semibold text-sm shadow-sm">
                  Simpan Pengaturan Cloud
                </button>
              </div>
            </form>
          </div>
        `;
      }

      return '';
    }

    // =========================================================================
    // 16. CHART RENDERING & MAIN RENDER LOOP
    // =========================================================================
    function renderAdminChartIfPresent() {
      const canvas = document.getElementById('admin-attendance-chart');
      if (!canvas || !window.Chart) return;

      if (state.charts.adminChart) {
        state.charts.adminChart.destroy();
      }

      const hadir = state.attendance.filter(a => a.status === 'Hadir').length;
      const terlambat = state.attendance.filter(a => a.status === 'Terlambat').length;
      const izin = state.attendance.filter(a => a.status === 'Izin').length;
      const sakit = state.attendance.filter(a => a.status === 'Sakit').length;

      state.charts.adminChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: ['Hadir Tepat Waktu', 'Terlambat', 'Izin', 'Sakit'],
          datasets: [{
            label: 'Jumlah Catatan Presensi',
            data: [hadir, terlambat, izin, sakit],
            backgroundColor: ['#15803D', '#D97706', '#2563EB', '#7C3AED'],
            borderRadius: 10,
            barThickness: 42
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#5C3A21' },
              grid: { color: '#F3ECE1' }
            },
            x: {
              ticks: { color: '#5C3A21', font: { weight: '600' } },
              grid: { display: false }
            }
          }
        }
      });
    }

    window.renderApp = function() {
      const root = document.getElementById('app-root');
      if (!root) return;

      // Preserve active input focus/value if user is typing in search
      const activeId = document.activeElement?.id;
      const selStart = document.activeElement?.selectionStart;

      if (!state.currentUser) {
        root.innerHTML = renderLoginPage();
      } else {
        const inner = state.currentUser.role === 'admin'
          ? renderAdminPortal()
          : renderEmployeePortal();
        root.innerHTML = renderAuthenticatedShell(inner);
      }

      if (window.lucide) lucide.createIcons();
      renderAdminChartIfPresent();

      if (activeId) {
        const el = document.getElementById(activeId);
        if (el) {
          el.focus();
          if (typeof selStart === 'number') el.setSelectionRange(selStart, selStart);
        }
      }
    };

    // Live WIB Clock Updater (updates clock text every second without full DOM re-render)
    setInterval(() => {
      const nowStr = formatTimeHHMMSS();
      const topClock = document.getElementById('live-wib-clock');
      const heroClock = document.getElementById('hero-wib-clock');
      const presensiClock = document.getElementById('presensi-wib-clock');
      if (topClock) topClock.textContent = `${nowStr} WIB`;
      if (heroClock) heroClock.textContent = nowStr;
      if (presensiClock) presensiClock.textContent = nowStr;
    }, 1000);

    // Online / Offline Network Listeners
    window.addEventListener('online', () => {
      state.isOnline = true;
      document.getElementById('offline-banner')?.classList.add('hidden');
      showToast('Kembali Online', 'Koneksi terhubung. Data disinkronisasi dengan cloud.', 'success');
      renderApp();
    });

    window.addEventListener('offline', () => {
      state.isOnline = false;
      document.getElementById('offline-banner')?.classList.remove('hidden');
      renderApp();
    });

    // =========================================================================
    // 17. BOOTSTRAP FIREBASE AUTH & CLOUD DATABASE
    // =========================================================================
    async function initWoodClock() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error('Firebase Auth error:', err);
      }

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          state.fbUser = user;
          state.cloudConnected = true;
          await seedDemoDataIfEmpty();
          startRealtimeListeners();
          renderApp();
        }
      });
    }

    initWoodClock();
  </script>
</body>
</html>
